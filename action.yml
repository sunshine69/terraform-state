name: "terraform-state"
description: "Store Terraform state (or any files) for your GitHub Actions as an encrypted artifact or repository file."
author: "Andrew Riggs"

inputs:
  encryption_key:
    description: "AES-256 Encryption key used to encrypt/decrypt files."
    required: false

  operation:
    description: "Specifies if the operation is to download or upload the files. [Options: download/upload]"
    required: true

  location:
    description: "Specifies the storage location. [Options: repository/artifact]"
    required: true

  directory:
    description: "Directory of the files."
    required: false
    default: "."

  github_token:
    description: "GitHub Access Token used to retrieve latest artifact."
    required: false

  files:
    description: >
      Comma-separated list of plaintext file paths (relative to directory) to
      encrypt/decrypt. The encrypted counterpart is <file>.enc.
      If empty (default), operates on terraform.tfstate only.
      Examples: "secrets.auto.tfvars.json" or
      "secrets.auto.tfvars.json,terraform.auto.tfvars"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Configure Git User
      shell: bash
      run: |
        git config --global user.name "terraform-state"
        git config --global user.email "github-actions@users.noreply.github.com"

    # ==================================================================
    # ARTIFACT — unencrypted (existing behaviour, tfstate only)
    # ==================================================================

    - name: Download Artifact
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'download' && inputs.encryption_key == '' }}"
      shell: bash
      run: |
        REPO="${{ github.repository }}"
        ARTIFACT_URI="https://api.github.com/repos/$REPO/actions/artifacts"
        TOKEN="${{ inputs.github_token }}"
        RESPONSE=$(curl -H "Authorization: token $TOKEN" -s $ARTIFACT_URI | jq -r '.artifacts[]')
        if [ "$RESPONSE" ] ; then
          LATEST_ARTIFACT_URI=$(echo "$RESPONSE" | jq -r 'select(.name=="Terraform State") | .archive_download_url' | sort -r | head -n 1)
          if [ "$LATEST_ARTIFACT_URI" ] ; then
            curl -L -H "Authorization: token $TOKEN" -o ${{ inputs.directory }}/terraform.tfstate.zip "$LATEST_ARTIFACT_URI"
            unzip -o ${{ inputs.directory }}/terraform.tfstate.zip -d ${{ inputs.directory }}
          fi
        fi

    - name: Upload Artifact
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'upload' && inputs.encryption_key == '' }}"
      uses: actions/upload-artifact@v4
      with:
        name: Terraform State
        path: "${{ inputs.directory }}/terraform.tfstate"
        overwrite: true

    # ==================================================================
    # ARTIFACT — encrypted, tfstate (files input empty)
    # ==================================================================

    - name: Download Encrypted Artifact
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'download' && inputs.encryption_key != '' && inputs.files == '' }}"
      shell: bash
      run: |
        REPO="${{ github.repository }}"
        ARTIFACT_URI="https://api.github.com/repos/$REPO/actions/artifacts"
        TOKEN="${{ inputs.github_token }}"
        RESPONSE=$(curl -H "Authorization: token $TOKEN" -s $ARTIFACT_URI | jq -r '.artifacts[]')
        if [ "$RESPONSE" ] ; then
          LATEST_ARTIFACT_URI=$(echo "$RESPONSE" | jq -r 'select(.name=="Encrypted Terraform State") | .archive_download_url' | sort -r | head -n 1)
          if [ "$LATEST_ARTIFACT_URI" ] ; then
            curl -L -H "Authorization: token $TOKEN" -o ${{ inputs.directory }}/terraform.tfstate.encrypted.zip "$LATEST_ARTIFACT_URI"
            unzip -o ${{ inputs.directory }}/terraform.tfstate.encrypted.zip -d ${{ inputs.directory }}
          fi
        fi

    - name: Decrypt Artifact
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'download' && inputs.encryption_key != '' && inputs.files == '' }}"
      shell: bash
      run: |
        openssl enc -d -aes256 -pbkdf2 \
          -in ${{ inputs.directory }}/terraform.tfstate.encrypted \
          -out ${{ inputs.directory }}/terraform.tfstate \
          -k ${{ inputs.encryption_key }}

    - name: Encrypt Artifact
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'upload' && inputs.encryption_key != '' && inputs.files == '' }}"
      shell: bash
      run: |
        openssl enc -e -aes256 -pbkdf2 \
          -in ${{ inputs.directory }}/terraform.tfstate \
          -out ${{ inputs.directory }}/terraform.tfstate.encrypted \
          -k ${{ inputs.encryption_key }}

    - name: Upload Encrypted Artifact
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'upload' && inputs.encryption_key != '' && inputs.files == '' }}"
      uses: actions/upload-artifact@v4
      with:
        name: Encrypted Terraform State
        path: "${{ inputs.directory }}/terraform.tfstate.encrypted"
        overwrite: true

    # ==================================================================
    # ARTIFACT — encrypted, custom files (files input provided)
    # ==================================================================

    - name: Download Encrypted Artifacts (files)
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'download' && inputs.encryption_key != '' && inputs.files != '' }}"
      shell: bash
      run: |
        REPO="${{ github.repository }}"
        TOKEN="${{ inputs.github_token }}"
        API="https://api.github.com/repos/$REPO"
        IFS=',' read -ra FILES <<< "${{ inputs.files }}"
        for f in "${FILES[@]}"; do
          f=$(echo "$f" | xargs)
          bname=$(basename "$f")
          artifact_name="Encrypted File: ${bname}.enc"
          ARTIFACT_JSON=$(curl -s -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/actions/artifacts?name=$artifact_name")
          DOWNLOAD_URL=$(echo "$ARTIFACT_JSON" | jq -r '.artifacts[0].archive_download_url // empty')
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::warning::Artifact not found: $artifact_name (skipping)"
            continue
          fi
          ZIP="/tmp/${bname}.enc.zip"
          curl -sL -H "Authorization: token $TOKEN" -o "$ZIP" "$DOWNLOAD_URL"
          # The artifact stores the file under its basename; extract into the
          # target directory so it lands where the Decrypt step expects it.
          unzip -o "$ZIP" -d "${{ inputs.directory }}"
          rm -f "$ZIP"
          echo "Downloaded: $artifact_name"
        done

    - name: Decrypt Files (artifact)
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'download' && inputs.encryption_key != '' && inputs.files != '' }}"
      shell: bash
      run: |
        IFS=',' read -ra FILES <<< "${{ inputs.files }}"
        for f in "${FILES[@]}"; do
          f=$(echo "$f" | xargs)  # trim whitespace
          enc="${{ inputs.directory }}/${f}.enc"
          plain="${{ inputs.directory }}/${f}"
          if [ ! -f "$enc" ]; then
            echo "::warning::Encrypted file not found: $enc (skipping)"
            continue
          fi
          openssl enc -d -aes256 -pbkdf2 -in "$enc" -out "$plain" -k ${{ inputs.encryption_key }}
          echo "Decrypted: $f"
        done

    - name: Encrypt Files (artifact)
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'upload' && inputs.encryption_key != '' && inputs.files != '' }}"
      shell: bash
      run: |
        IFS=',' read -ra FILES <<< "${{ inputs.files }}"
        for f in "${FILES[@]}"; do
          f=$(echo "$f" | xargs)
          plain="${{ inputs.directory }}/${f}"
          enc="${{ inputs.directory }}/${f}.enc"
          if [ ! -f "$plain" ]; then
            echo "::error::Plaintext file not found: $plain"
            exit 1
          fi
          openssl enc -e -aes256 -pbkdf2 -in "$plain" -out "$enc" -k ${{ inputs.encryption_key }}
          echo "Encrypted: $f -> $(basename "$f").enc"
        done

    - name: Upload Encrypted Files (artifact)
      if: "${{ inputs.location == 'artifact' && inputs.operation == 'upload' && inputs.encryption_key != '' && inputs.files != '' }}"
      shell: bash
      run: |
        REPO="${{ github.repository }}"
        TOKEN="${{ inputs.github_token }}"
        API="https://api.github.com/repos/$REPO"
        IFS=',' read -ra FILES <<< "${{ inputs.files }}"
        for f in "${FILES[@]}"; do
          f=$(echo "$f" | xargs)
          bname=$(basename "$f")
          enc_path="${{ inputs.directory }}/${f}.enc"
          artifact_name="Encrypted File: ${bname}.enc"
          if [ ! -f "$enc_path" ]; then
            echo "::error::Encrypted file not found: $enc_path"
            exit 1
          fi
          # 1) Create the artifact (stores the file under its basename)
          CREATE_JSON=$(curl -s -X POST -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/actions/artifacts" \
            -d "{\"name\":\"$artifact_name\",\"files\":[\"${bname}.enc\"]}")
          UPLOAD_URL=$(echo "$CREATE_JSON" | jq -r '.upload_url // empty')
          if [ -z "$UPLOAD_URL" ]; then
            echo "::error::Failed to create artifact $artifact_name: $CREATE_JSON"
            exit 1
          fi
          # 2) PUT the encrypted file to the signed upload URL
          PUT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$enc_path" "$UPLOAD_URL")
          if [ "$PUT_STATUS" != "201" ] && [ "$PUT_STATUS" != "200" ]; then
            echo "::error::Upload of $artifact_name returned HTTP $PUT_STATUS"
            exit 1
          fi
          echo "Uploaded: $artifact_name"
        done

    # ==================================================================
    # REPOSITORY — unencrypted (existing behaviour, tfstate only)
    # ==================================================================

    - name: Commit Repository File
      if: "${{ inputs.location == 'repository' && inputs.operation == 'upload' && inputs.encryption_key == '' }}"
      shell: bash
      run: |
        git add -f ${{ inputs.directory }}/terraform.tfstate
        git commit -m "🏗️ Automatically Updated Terraform State."
        git push

    # ==================================================================
    # REPOSITORY — encrypted, tfstate (files input empty)
    # ==================================================================

    - name: Decrypt Repository File
      if: "${{ inputs.location == 'repository' && inputs.operation == 'download' && inputs.encryption_key != '' && inputs.files == '' }}"
      shell: bash
      run: |
        openssl enc -d -aes256 -pbkdf2 \
          -in ${{ inputs.directory }}/terraform.tfstate.encrypted \
          -out ${{ inputs.directory }}/terraform.tfstate \
          -k ${{ inputs.encryption_key }}

    - name: Encrypt and Commit Repository File
      if: "${{ inputs.location == 'repository' && inputs.operation == 'upload' && inputs.encryption_key != '' && inputs.files == '' }}"
      shell: bash
      run: |
        openssl enc -e -aes256 -pbkdf2 \
          -in ${{ inputs.directory }}/terraform.tfstate \
          -out ${{ inputs.directory }}/terraform.tfstate.encrypted \
          -k ${{ inputs.encryption_key }}
        git add -f ${{ inputs.directory }}/terraform.tfstate.encrypted
        git commit -m "🏗️ Automatically Updated Encrypted Terraform State."
        git push

    # ==================================================================
    # REPOSITORY — encrypted, custom files (files input provided)
    # ==================================================================

    - name: Decrypt Files (repository)
      if: "${{ inputs.location == 'repository' && inputs.operation == 'download' && inputs.encryption_key != '' && inputs.files != '' }}"
      shell: bash
      run: |
        IFS=',' read -ra FILES <<< "${{ inputs.files }}"
        for f in "${FILES[@]}"; do
          f=$(echo "$f" | xargs)
          enc="${{ inputs.directory }}/${f}.enc"
          plain="${{ inputs.directory }}/${f}"
          if [ ! -f "$enc" ]; then
            echo "::warning::Encrypted file not found: $enc (skipping)"
            continue
          fi
          openssl enc -d -aes256 -pbkdf2 -in "$enc" -out "$plain" -k ${{ inputs.encryption_key }}
          echo "Decrypted: $f"
        done

    - name: Encrypt and Commit Files (repository)
      if: "${{ inputs.location == 'repository' && inputs.operation == 'upload' && inputs.encryption_key != '' && inputs.files != '' }}"
      shell: bash
      run: |
        IFS=',' read -ra FILES <<< "${{ inputs.files }}"
        ENCS=()
        for f in "${FILES[@]}"; do
          f=$(echo "$f" | xargs)
          plain="${{ inputs.directory }}/${f}"
          enc="${{ inputs.directory }}/${f}.enc"
          if [ ! -f "$plain" ]; then
            echo "::error::Plaintext file not found: $plain"
            exit 1
          fi
          openssl enc -e -aes256 -pbkdf2 -in "$plain" -out "$enc" -k ${{ inputs.encryption_key }}
          ENCS+=("$enc")
          echo "Encrypted: $f -> $(basename "$f").enc"
        done
        git add -f "${ENCS[@]}"
        git commit -m "🔐 Automatically Updated Encrypted Files."
        git push
